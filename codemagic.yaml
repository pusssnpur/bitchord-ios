workflows:
  ios-build:
    name: iOS Build (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.music.bitchord"
    scripts:
      - name: Setup Gradle
        script: |
          chmod +x gradlew
      - name: Build KMP Framework
        script: |
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
      - name: Install Pods
        script: |
          cd iosApp
          pod install
      - name: Create ExportOptions.plist
        script: |
          cd iosApp
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>method</key>\n    <string>ad-hoc</string>\n    <key>compileBitcode</key>\n    <false/>\n    <key>stripSwiftSymbols</key>\n    <true/>\n    <key>signingStyle</key>\n    <string>manual</string>\n    <key>provisioningProfiles</key>\n    <dict/>\n</dict>\n</plist>\n' > ExportOptions.plist
      - name: Build iOS (Unsigned)
        script: |
          cd iosApp
          xcodebuild -workspace BitChordIOS.xcworkspace \
                     -scheme BitChordIOS \
                     -configuration Release \
                     -destination generic/platform=iOS \
                     -archivePath build/BitChordIOS.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     archive
      - name: Export IPA (Unsigned)
        script: |
          cd iosApp
          xcodebuild -exportArchive \
                     -archivePath build/BitChordIOS.xcarchive \
                     -exportPath build/Export \
                     -exportOptionsPlist ExportOptions.plist \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO
    artifacts:
      - iosApp/build/Export/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com