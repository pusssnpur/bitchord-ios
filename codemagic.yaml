workflows:
  ios-build:
    name: iOS Build (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.music.bitchord"
    scripts:
      - name: Enter KMP Project
        script: |
          cd BitChordIOS
          chmod +x gradlew
      - name: Build KMP Framework
        script: |
          cd BitChordIOS
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
      - name: Install Pods
        script: |
          cd BitChordIOS/iosApp
          pod install
      - name: Build iOS (Unsigned)
        script: |
          cd BitChordIOS/iosApp
          xcodebuild -workspace BitChordIOS.xcworkspace \
                     -scheme BitChordIOS \
                     -configuration Release \
                     -destination generic/platform=iOS \
                     -archivePath build/BitChordIOS.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     archive
      - name: Export IPA (Unsigned)
        script: |
          cd BitChordIOS/iosApp
          cat > ExportOptions.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>ad-hoc</string>
    <key>compileBitcode</key>
    <false/>
    <key>stripSwiftSymbols</key>
    <true/>
    <key>signingStyle</key>
    <string>manual</string>
    <key>provisioningProfiles</key>
    <dict/>
</dict>
</plist>
EOF
          xcodebuild -exportArchive \
                     -archivePath build/BitChordIOS.xcarchive \
                     -exportPath build/Export \
                     -exportOptionsPlist ExportOptions.plist \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO
    artifacts:
      - BitChordIOS/iosApp/build/Export/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com