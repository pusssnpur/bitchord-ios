# codemagic.yaml
workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials  # for code signing
      vars:
        BUNDLE_ID: "com.music.bitchord"
    scripts:
      - name: Setup
        script: |
          cd BitChordIOS
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
      - name: Install Pods
        script: |
          cd BitChordIOS/iosApp
          pod install
      - name: Build iOS
        script: |
          cd BitChordIOS/iosApp
          xcodebuild -workspace BitChordIOS.xcworkspace \
                     -scheme BitChordIOS \
                     -configuration Release \
                     -destination generic/platform=iOS \
                     -archivePath build/BitChordIOS.xcarchive \
                     archive
      - name: Export IPA
        script: |
          cd BitChordIOS/iosApp
          xcodebuild -exportArchive \
                     -archivePath build/BitChordIOS.xcarchive \
                     -exportPath build/Export \
                     -exportOptionsPlist ExportOptions.plist
    artifacts:
      - build/Export/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
